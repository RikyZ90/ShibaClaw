name: Temporary security lock refresh

on:
  push:
    branches:
      - security/dependency-vulns-2026-10-24

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/dependency-vulns-2026-10-24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Refresh vulnerable packages in lockfile
        run: uv lock --upgrade-package filelock --upgrade-package pypdf --upgrade-package setuptools

      - name: Verify patched versions in lockfile
        shell: bash
        run: |
          uv lock --check
          python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))
          versions = {pkg['name']: pkg['version'] for pkg in lock['package'] if pkg['name'] in {'filelock', 'pypdf', 'setuptools'}}
          print('Resolved security-sensitive packages:', versions)

          def v(value: str) -> tuple[int, ...]:
              return tuple(int(part) for part in value.split('.') if part.isdigit())

          assert v(versions['filelock']) >= (4, 2, 1), versions
          assert v(versions['pypdf']) >= (6, 21, 2), versions
          assert v(versions['setuptools']) >= (84, 1, 0), versions
          PY

      - name: Run RAG dependency smoke test
        run: |
          uv sync --extra rag
          uv run pytest tests/test_startup_lazy_rag.py

      - name: Commit refreshed lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lock-refresh.yml
          git add uv.lock
          git commit -m "security: refresh vulnerable transitive dependencies"
          git push origin HEAD:security/dependency-vulns-2026-10-24
