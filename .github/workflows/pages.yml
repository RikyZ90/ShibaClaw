name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/shibaclaw_64.png'
      - 'assets/shibaclaw_256.png'
      - 'assets/shibdemo.webp'
      - 'assets/shibmobiledemo.webp'
      - 'scripts/build_pages.py'
      - 'tests/test_pages_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'assets/shibaclaw_64.png'
      - 'assets/shibaclaw_256.png'
      - 'assets/shibdemo.webp'
      - 'assets/shibmobiledemo.webp'
      - 'scripts/build_pages.py'
      - 'tests/test_pages_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check landing page
        run: python -m unittest discover -s tests -p test_pages_site.py -v
      - name: Check demo controls
        run: node --test site/site.test.mjs
      - name: Build public files
        run: python scripts/build_pages.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
