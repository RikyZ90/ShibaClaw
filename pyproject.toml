[project]
name = "shibaclaw"
version = "0.9.20"
description = "A lightweight personal AI assistant framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "shibaclaw contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "typer>=0.27.2,<1.0.0",
    "anthropic>=0.125.0,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "websockets>=16.1.1,<17.0",
    "httpx>=0.28.1,<1.0.0",
    "ddgs>=9.16.0,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.9,<1.0.0",
    "rich>=14.3.4,<16.0.0",
    "croniter>=6.2.3,<7.0.0",
    "socksio>=1.0.0,<2.0.0",
    "prompt-toolkit>=3.0.53,<4.0.0",
    "mcp>=1.29.1,<2.0.0",
    "json-repair>=0.63.4,<1.0.0",
    "openai>=2.54.0,<3.0.0",
    "tiktoken>=0.14.0,<1.0.0",
    "uvicorn>=0.52.4,<1.0.0",
    "starlette>=1.6.0,<2.0.0",
    "aiofiles>=25.1.0,<26.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3,<7.0",
    "pywebview>=6.2.1,<7.0",
    "pystray>=0.19.5,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
    "python-telegram-bot[socks]>=22.8,<23.0",
    "python-socks[asyncio]>=2.8.2,<3.0.0",
    "cryptography>=50.0.1",
    "keyring>=24.0.0",
    "filelock>=3.32.5,<4.0.0",
]

[project.optional-dependencies]
rag = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "faiss-cpu>=1.14.3",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.15.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
]
rag-local = [
    "shibaclaw[rag]",
    "langchain-huggingface>=0.1.0,<1.0.0",
    "sentence-transformers>=5.6.0",
]
slack = [
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
]
dingtalk = [
    "dingtalk-stream>=0.24.0,<1.0.0",
]
feishu = [
    "lark-oapi>=1.5.0,<2.0.0",
]
qq = [
    "qq-botpy>=1.2.0,<2.0.0",
]
wecom = [
    "wecom-aibot-sdk-python>=0.1.5",
    "aiohttp>=3.9.0,<4.0.0",
]
matrix = [
    "matrix-nio>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
    "cryptography>=46.0.7",
]
mochat = [
    "python-socketio>=5.16.4,<6.0.0",
    "msgpack>=1.2.2,<2.0.0",
]
windows-native = [
    "pythonnet>=3.0,<4.0",
]
all-channels = [
    "shibaclaw[slack,dingtalk,feishu,qq,wecom,matrix]",
]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.16.5",
    "pyinstaller>=6.22.2,<7.0.0",
]

[project.scripts]
shibaclaw = "shibaclaw.cli.commands:app"

[project.gui-scripts]
shibaclaw-desktop = "shibaclaw.desktop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "shibaclaw/**/*.py",
    "shibaclaw/**/*.json",
    "shibaclaw/templates/**/*.md",
    "shibaclaw/skills/**/*.md",
    "shibaclaw/skills/**/*.sh",
    "shibaclaw/webui/static/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["shibaclaw"]

[tool.hatch.build.targets.wheel.sources]
"shibaclaw" = "shibaclaw"

[tool.hatch.build.targets.wheel.force-include]
"assets" = "shibaclaw/assets"


[tool.hatch.build.targets.sdist]
include = [
    "shibaclaw/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "N", "W"]
ignore = ["E501", "I001", "W291", "W293", "D", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*retry_after.*",
    "ignore::telegram.warnings.PTBDeprecationWarning",
]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
shibaclaw = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
